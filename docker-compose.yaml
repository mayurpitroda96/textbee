
services:
  # MongoDB Database
  textbee-db:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-textbee_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: textbee
    volumes:
      - mongodb_data:/data/db
    networks:
      - textbee-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping:1}).ok"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis Queue
  textbee-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - textbee-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # TextBee API
  textbee-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "3001"
      REDIS_URL: ${REDIS_URL:-redis://textbee-redis:6379}
      MONGO_URI: ${MONGO_URI}
    depends_on:
      textbee-db:
        condition: service_healthy
      textbee-redis:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - textbee-network

  # TextBee Web Dashboard
  textbee-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: "3000"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - textbee-api
    expose:
      - "3000"
    networks:
      - textbee-network

networks:
  textbee-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
